baseURL = 'https://my-first-repo-gamma-five.vercel.app/'  # 你的域名或 Vercel 提供的 URL
languageCode = 'zh-cn'
title = 'ZenNiu'
theme = 'PaperMod'

# 开启 Raw HTML 支持（方便后期嵌入自定义组件/代码）
[markup.goldmark.renderer]
  unsafe = true

# 开启文章搜索功能支持（重要：PaperMod 搜索依赖 json 输出）
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ----------------- PaperMod 主题专属配置 -----------------
[params]
  env = "production"
  title = "ZenNiu"
  description = "记录学习&生活&技术"
  keywords = ["Hugo", "PaperMod", "Blog", "AI"]
  author = "ZenNiu"
  
  # 首页样式模式：Profile Mode（个人主页卡片）或 Regular（直接展示文章列表）
  defaultTheme = "auto" # 可选: light, dark, auto
  disableThemeToggle = false # 是否禁用切换暗黑/亮色模式按钮

  ShowReadingTime = true      # 显示阅读时间
  ShowShareButtons = true     # 显示分享按钮
  ShowPostNavLinks = true     # 显示上一篇/下一篇链接
  ShowBreadCrumbs = true      # 显示面包屑导航
  ShowCodeCopyButtons = true  # 开启代码块一键复制按钮
  ShowToc = true              # 文章页自动显示目录
  TocOpen = false             # 默认折叠目录，点击展开

  # 1. 首页模式（推荐 Profile Mode 个人名片风格）
  [params.profileMode]
    enabled = true
    title = "👋 嗨，我是ZenNiu"
    subtitle = "专注于AI 图像处理与个人项目探索。"
    imageUrl = "https://github.com/Ehrgeizig-debug.png" # 你的头像图片 URL
    imageWidth = 120
    imageHeight = 120
    imageTitle = "Avatar"
    
    [[params.profileMode.buttons]]
      name = "📚 文章列表"
      url = "posts"
      
    [[params.profileMode.buttons]]
      name = "🔍 站内搜索"
      url = "search"

  # 2. 社交媒体图标（显示在首页底部或 Profile 卡片中）
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Ehrgeizig-debug"
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/ZenNiuab"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:3389947087@qq.com"

# ----------------- 顶部导航栏配置 -----------------
[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 20

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 40